{% extends 'base.html' %}

{% block title %}Verify Email - FireSDN{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="FireSDN" class="auth-logo">
        <h2>Verify Your Email</h2>
        <p>We've sent a verification code to <strong>{{ email }}</strong></p>
        
        <form method="POST">
            <div class="form-group">
                <label for="otp">Verification Code</label>
                <input type="text" id="otp" name="otp" required placeholder="Enter 6-digit code" maxlength="6" pattern="\d{6}">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Verify Email</button>
        </form>
        
        <p class="auth-switch">Didn't get the code? <a href="{{ url_for('signup') }}">Try again</a></p>
    </div>
</div>
{% endblock %}
